version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000" 
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - redis 
    env_file:
      - .env
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data: